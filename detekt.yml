build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - "Composable"
  CyclomaticComplexMethod:
    threshold: 15
  TooManyFunctions:
    active: false
  ComplexInterface:
    threshold: 15
  NestedBlockDepth:
    threshold: 5

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    allowedNames: "(_|ignored|expected|serialVersionUID)"
  WildcardImport:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][_A-Za-z0-9]*"
  VariableNaming:
    variablePattern: "[a-z][A-Za-z0-9]*"

exceptions:
  TooGenericExceptionCaught:
    exceptionNames:
      - "RuntimeException"
      - "Throwable"
    allowedExceptionNameRegex: "(_|(ignore|expected).*)"
  SwallowedException:
    ignoredExceptionTypes:
      - "InterruptedException"
      - "MalformedURLException"
      - "NumberFormatException"
      - "ParseException"

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true



