name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  assemble_and_test:
    runs-on: self-hosted

    steps:
      # ── Fix permissions BEFORE checkout ────────────────────────────────
      - name: Fix workspace ownership (pre-checkout)
        run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true

      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker image ───────────────────────────────────────────────────────
      # Plain `docker build` uses Docker's own overlay layer cache, which is
      # already persistent on the self-hosted machine between runs.
      # No external BuildKit builder is created, so there is no socket lookup.
      - name: Ensure host cache directories exist
        run: |
          mkdir -p /media/caio-luis/hdzao/.gradle
          mkdir -p /media/caio-luis/hdzao/bundle

      - name: Build CI Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --tag ci-android:latest \
            .github/docker

      # ── CI steps (all run inside the container) ────────────────────────────
      # Volumes:
      #   /workspace            – project source (read/write)
      #   /root/.gradle         – Gradle wrapper + dependency cache (persistent)
      #   /bundle               – Bundler gem cache (persistent)
      # BUNDLE_PATH=/bundle tells Bundler where to install / look for gems.
      - name: Run CI inside Docker container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "/media/caio-luis/hdzao/.gradle:/root/.gradle" \
            -v "/media/caio-luis/hdzao/bundle:/bundle" \
            -e BUNDLE_PATH=/bundle \
            -w /workspace \
            ci-android:latest \
            bash -c "
              set -euo pipefail
              chmod +x gradlew
              bundle install --jobs 4 --retry 3
              bundle exec fastlane assemble
              bundle exec fastlane test
            "

      # ── Fix permissions AFTER Docker ───────────────────────────────────
      - name: Fix workspace ownership (post-docker)
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}"

