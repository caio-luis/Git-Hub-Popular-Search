name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOST_GRADLE_CACHE: /media/caio-luis/hdzao/.gradle
  HOST_BUNDLE_CACHE: /media/caio-luis/hdzao/bundle
  CONTAINER_GRADLE_CACHE: /root/.gradle
  CONTAINER_BUNDLE_CACHE: /bundle

jobs:
  assemble_and_test:
    runs-on: self-hosted
    timeout-minutes: 90
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      # ── Fix permissions BEFORE checkout ────────────────────────────────
      - name: Fix workspace ownership (pre-checkout)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            alpine chown -R $(id -u):$(id -g) /workspace || true

      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker image ───────────────────────────────────────────────────────
      # Plain `docker build` uses Docker's own overlay layer cache, which is
      # already persistent on the self-hosted machine between runs.
      # No external BuildKit builder is created, so there is no socket lookup.
      - name: Ensure host cache directories exist
        run: |
          mkdir -p "${HOST_GRADLE_CACHE}"
          mkdir -p "${HOST_BUNDLE_CACHE}"

      - name: Build CI Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --tag ci-android:latest \
            .github/docker

      # ── CI steps (all run inside the container) ────────────────────────────
      # Volumes:
      #   /workspace            – project source (read/write)
      #   /root/.gradle         – Gradle wrapper + dependency cache (persistent)
      #   /bundle               – Bundler gem cache (persistent)
      # BUNDLE_PATH=/bundle tells Bundler where to install / look for gems.
      - name: Run Spotless and Detekt checks inside Docker container
        run: |
          docker run --rm \
            --init \
            --tmpfs /tmp:exec,mode=1777 \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOST_GRADLE_CACHE}:${CONTAINER_GRADLE_CACHE}" \
            -v "${HOST_BUNDLE_CACHE}:${CONTAINER_BUNDLE_CACHE}" \
            -e GRADLE_USER_HOME="${CONTAINER_GRADLE_CACHE}" \
            -e BUNDLE_PATH="${CONTAINER_BUNDLE_CACHE}" \
            -w /workspace \
            ci-android:latest \
            bash -c "
              set -euo pipefail
              chmod +x gradlew
              bundle check || bundle install --jobs 4 --retry 3
              bundle exec fastlane android lint
            "

      - name: Run tests inside Docker container
        run: |
          docker run --rm \
            --init \
            --tmpfs /tmp:exec,mode=1777 \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOST_GRADLE_CACHE}:${CONTAINER_GRADLE_CACHE}" \
            -v "${HOST_BUNDLE_CACHE}:${CONTAINER_BUNDLE_CACHE}" \
            -e GRADLE_USER_HOME="${CONTAINER_GRADLE_CACHE}" \
            -e BUNDLE_PATH="${CONTAINER_BUNDLE_CACHE}" \
            -w /workspace \
            ci-android:latest \
            bash -c "
              set -euo pipefail
              chmod +x gradlew
              bundle check || bundle install --jobs 4 --retry 3
              bundle exec fastlane android test
            "

      - name: Run JaCoCo coverage verification inside Docker container
        run: |
          docker run --rm \
            --init \
            --tmpfs /tmp:exec,mode=1777 \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOST_GRADLE_CACHE}:${CONTAINER_GRADLE_CACHE}" \
            -v "${HOST_BUNDLE_CACHE}:${CONTAINER_BUNDLE_CACHE}" \
            -e GRADLE_USER_HOME="${CONTAINER_GRADLE_CACHE}" \
            -e BUNDLE_PATH="${CONTAINER_BUNDLE_CACHE}" \
            -w /workspace \
            ci-android:latest \
            bash -c "
              set -euo pipefail
              chmod +x gradlew
              bundle check || bundle install --jobs 4 --retry 3
              bundle exec fastlane android coverage
            "

      - name: Run assemble inside Docker container
        run: |
          docker run --rm \
            --init \
            --tmpfs /tmp:exec,mode=1777 \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOST_GRADLE_CACHE}:${CONTAINER_GRADLE_CACHE}" \
            -v "${HOST_BUNDLE_CACHE}:${CONTAINER_BUNDLE_CACHE}" \
            -e GRADLE_USER_HOME="${CONTAINER_GRADLE_CACHE}" \
            -e BUNDLE_PATH="${CONTAINER_BUNDLE_CACHE}" \
            -w /workspace \
            ci-android:latest \
            bash -c "
              set -euo pipefail
              chmod +x gradlew
              bundle check || bundle install --jobs 4 --retry 3
              bundle exec fastlane android assemble
            "

      # ── Fix permissions AFTER Docker ───────────────────────────────────
      - name: Fix workspace ownership (post-docker)
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            alpine chown -R $(id -u):$(id -g) /workspace

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/jacoco/**
            **/build/reports/detekt/**

